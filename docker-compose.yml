version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-forge
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

