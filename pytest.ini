[pytest]
# Конфигурация pytest для Agent Forge

# Автоматическое определение async test mode (для pytest-asyncio)
asyncio_mode = auto

# Директория с тестами
testpaths = tests

# Параметры вывода
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркеры для категоризации тестов
markers =
    unit: модульные тесты (узлы графа без сети)
    integration: интеграционные тесты (граф end-to-end)
    slow: медленные тесты (API-вызовы, если были бы)

# Минимальный покрыток и отчёт
addopts = -v --tb=short
